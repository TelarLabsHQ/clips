<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#eef1f6;font:16px/1.5 Roboto,Arial,sans-serif;color:#202124}.c{max-width:640px;margin:0 auto;padding:12px}

<div class="card"><p class="q">1. Which planet is closest to the Sun?</p><label><input type="radio" name="a">Venus</label><label><input type="radio" name="a">Mercury</label><label><input type="radio" name="a">Mars</label></div>
<div class="card"><p class="q">2. What gas do plants take in from the air?</p><label><input type="radio" name="b">Oxygen</label><label><input type="radio" name="b">Carbon dioxide</label><label><input type="radio" name="b">Nitrogen</label></div>
<div class="card"><p class="q">3. Water boils at what temperature at sea level?</p><label><input type="radio" name="c">90 °C</label><label><input type="radio" name="c">100 °C</label><label><input type="radio" name="c">120 °C</label></div>
</div></body></html>
